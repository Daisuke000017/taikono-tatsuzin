<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C92A2A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="drum1" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFE5B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="400" fill="url(#bg1)"/>

  <!-- 和風パターン -->
  <g opacity="0.1">
    <circle cx="50" cy="50" r="30" fill="white"/>
    <circle cx="350" cy="50" r="30" fill="white"/>
    <circle cx="50" cy="350" r="30" fill="white"/>
    <circle cx="350" cy="350" r="30" fill="white"/>
  </g>

  <!-- 太鼓 -->
  <circle cx="200" cy="200" r="120" fill="url(#drum1)" stroke="#654321" stroke-width="8"/>
  <circle cx="200" cy="200" r="100" fill="#F5F5DC" opacity="0.9"/>
  <circle cx="200" cy="200" r="80" fill="none" stroke="#DDD" stroke-width="2"/>

  <!-- 十字模様 -->
  <line x1="200" y1="120" x2="200" y2="280" stroke="#CCC" stroke-width="3" opacity="0.5"/>
  <line x1="120" y1="200" x2="280" y2="200" stroke="#CCC" stroke-width="3" opacity="0.5"/>

  <!-- バチ -->
  <g transform="translate(100, 100) rotate(-45)">
    <rect x="0" y="0" width="15" height="100" rx="7" fill="#8B4513"/>
    <circle cx="7.5" cy="5" r="8" fill="#CD853F"/>
  </g>
  <g transform="translate(300, 100) rotate(45)">
    <rect x="0" y="0" width="15" height="100" rx="7" fill="#8B4513"/>
    <circle cx="7.5" cy="5" r="8" fill="#CD853F"/>
  </g>

  <!-- タイトル -->
  <text x="200" y="370" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">
    サンプル曲 1
  </text>
  <text x="200" y="395" font-family="sans-serif" font-size="16" text-anchor="middle" fill="white" opacity="0.8">
    Traditional Rhythm
  </text>
</svg>
