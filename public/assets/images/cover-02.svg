<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow2">
      <stop offset="0%" style="stop-color:#00F5FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00F5FF;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="400" fill="url(#bg2)"/>

  <!-- グリッド -->
  <g opacity="0.2" stroke="#00F5FF" stroke-width="2" fill="none">
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
  </g>

  <!-- 中央の円 -->
  <circle cx="200" cy="200" r="100" fill="url(#glow2)"/>
  <circle cx="200" cy="200" r="80" fill="none" stroke="#00F5FF" stroke-width="4"/>
  <circle cx="200" cy="200" r="60" fill="none" stroke="#00F5FF" stroke-width="2" opacity="0.6"/>
  <circle cx="200" cy="200" r="40" fill="none" stroke="#00F5FF" stroke-width="2" opacity="0.4"/>

  <!-- 波形 -->
  <path d="M 50 200 Q 100 150, 150 200 T 250 200 T 350 200" fill="none" stroke="#00F5FF" stroke-width="3" opacity="0.7"/>
  <path d="M 50 200 Q 100 250, 150 200 T 250 200 T 350 200" fill="none" stroke="#00F5FF" stroke-width="3" opacity="0.7"/>

  <!-- パーティクル -->
  <circle cx="80" cy="80" r="3" fill="#00F5FF"/>
  <circle cx="320" cy="80" r="4" fill="#00F5FF"/>
  <circle cx="80" cy="320" r="3" fill="#00F5FF"/>
  <circle cx="320" cy="320" r="4" fill="#00F5FF"/>
  <circle cx="150" cy="50" r="2" fill="#00F5FF"/>
  <circle cx="250" cy="350" r="2" fill="#00F5FF"/>

  <!-- タイトル -->
  <text x="200" y="370" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">
    サンプル曲 2
  </text>
  <text x="200" y="395" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#00F5FF">
    Electronic Beats
  </text>
</svg>
