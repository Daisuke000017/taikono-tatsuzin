<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FA709A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FEE140;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#30CFD0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="400" fill="url(#bg3)"/>

  <!-- カラフルな円 -->
  <circle cx="100" cy="100" r="50" fill="#FF6B6B" opacity="0.7"/>
  <circle cx="300" cy="100" r="50" fill="#4ECDC4" opacity="0.7"/>
  <circle cx="100" cy="300" r="50" fill="#45B7D1" opacity="0.7"/>
  <circle cx="300" cy="300" r="50" fill="#FFA07A" opacity="0.7"/>

  <!-- 音符 -->
  <g transform="translate(200, 150)">
    <ellipse cx="0" cy="0" rx="20" ry="15" fill="white" transform="rotate(-20)"/>
    <rect x="18" y="-60" width="6" height="60" fill="white"/>
    <circle cx="21" cy="-60" r="12" fill="white"/>
  </g>

  <g transform="translate(250, 200)">
    <ellipse cx="0" cy="0" rx="18" ry="13" fill="white" transform="rotate(-20)"/>
    <rect x="16" y="-50" width="5" height="50" fill="white"/>
  </g>

  <!-- 星 -->
  <g fill="#FFD700">
    <path d="M 80 200 L 85 210 L 95 210 L 87 216 L 90 226 L 80 220 L 70 226 L 73 216 L 65 210 L 75 210 Z"/>
    <path d="M 320 180 L 325 190 L 335 190 L 327 196 L 330 206 L 320 200 L 310 206 L 313 196 L 305 190 L 315 190 Z"/>
    <path d="M 200 80 L 205 90 L 215 90 L 207 96 L 210 106 L 200 100 L 190 106 L 193 96 L 185 90 L 195 90 Z"/>
  </g>

  <!-- 中央装飾 -->
  <circle cx="200" cy="200" r="70" fill="none" stroke="white" stroke-width="4" opacity="0.8"/>
  <circle cx="200" cy="200" r="60" fill="white" opacity="0.3"/>

  <!-- ハート -->
  <g transform="translate(200, 200) scale(0.8)">
    <path d="M 0,-20 C -20,-40, -50,-30, -50,0 C -50,30, 0,50, 0,50 C 0,50, 50,30, 50,0 C 50,-30, 20,-40, 0,-20 Z" fill="#FF1493" opacity="0.8"/>
  </g>

  <!-- タイトル -->
  <text x="200" y="370" font-family="sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">
    サンプル曲 3
  </text>
  <text x="200" y="395" font-family="sans-serif" font-size="16" text-anchor="middle" fill="white">
    Happy Pop
  </text>
</svg>
