<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Rock/Energy theme with lightning and flames -->
  <defs>
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4500;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#rockGrad)"/>

  <!-- Glow effect -->
  <circle cx="200" cy="200" r="150" fill="url(#glow)" opacity="0.6"/>

  <!-- Lightning bolts -->
  <path d="M 100 80 L 140 160 L 120 160 L 160 260 L 130 180 L 150 180 Z" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
  <path d="M 280 100 L 260 180 L 280 180 L 240 280 L 270 200 L 250 200 Z" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>

  <!-- Guitar pick shape -->
  <path d="M 200 100 Q 240 100 250 140 Q 260 180 200 220 Q 140 180 150 140 Q 160 100 200 100 Z"
        fill="#8B0000" stroke="#FFD700" stroke-width="4"/>

  <!-- Sound waves -->
  <path d="M 50 200 Q 100 180 150 200 T 250 200 T 350 200"
        stroke="#FF6347" stroke-width="4" fill="none" opacity="0.8"/>
  <path d="M 50 220 Q 100 240 150 220 T 250 220 T 350 220"
        stroke="#FF6347" stroke-width="4" fill="none" opacity="0.6"/>

  <!-- Stars -->
  <circle cx="80" cy="320" r="4" fill="#FFD700"/>
  <circle cx="320" cy="340" r="5" fill="#FFD700"/>
  <circle cx="150" cy="350" r="3" fill="#FFD700"/>
  <circle cx="280" cy="300" r="4" fill="#FFD700"/>

  <!-- Rock hand gesture -->
  <g transform="translate(200, 280)">
    <!-- Palm -->
    <ellipse cx="0" cy="0" rx="20" ry="30" fill="#FFD700" stroke="#000" stroke-width="2"/>
    <!-- Index finger up -->
    <rect x="-5" y="-35" width="10" height="40" rx="5" fill="#FFD700" stroke="#000" stroke-width="2"/>
    <!-- Pinky finger up -->
    <rect x="15" y="-30" width="10" height="35" rx="5" fill="#FFD700" stroke="#000" stroke-width="2"/>
  </g>

  <!-- Title text would go here if needed -->
</svg>
