<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Peaceful/Calm theme with moon, stars, and clouds -->
  <defs>
    <linearGradient id="peacefulGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#191970;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4B0082;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000080;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0%" style="stop-color:#F0E68C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0E68C;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#peacefulGrad)"/>

  <!-- Moon glow -->
  <circle cx="280" cy="120" r="80" fill="url(#moonGlow)" opacity="0.5"/>

  <!-- Moon -->
  <circle cx="280" cy="120" r="50" fill="#F0E68C"/>
  <!-- Moon crater -->
  <circle cx="290" cy="110" r="8" fill="#DAA520" opacity="0.5"/>
  <circle cx="270" cy="130" r="10" fill="#DAA520" opacity="0.4"/>
  <circle cx="295" cy="135" r="6" fill="#DAA520" opacity="0.6"/>

  <!-- Stars -->
  <g fill="#FFFFFF">
    <circle cx="80" cy="60" r="2"/>
    <circle cx="150" cy="40" r="3"/>
    <circle cx="350" cy="80" r="2"/>
    <circle cx="120" cy="120" r="2.5"/>
    <circle cx="340" cy="180" r="2"/>
    <circle cx="90" cy="180" r="3"/>
    <circle cx="180" cy="90" r="2"/>
    <circle cx="220" cy="60" r="2.5"/>
    <circle cx="50" cy="140" r="2"/>
    <circle cx="370" cy="120" r="3"/>
  </g>

  <!-- Twinkling stars (larger) -->
  <g fill="#FFD700">
    <path d="M 60 200 l 3 9 l 9 3 l -9 3 l -3 9 l -3 -9 l -9 -3 l 9 -3 Z"/>
    <path d="M 330 240 l 4 12 l 12 4 l -12 4 l -4 12 l -4 -12 l -12 -4 l 12 -4 Z"/>
    <path d="M 140 300 l 2.5 7.5 l 7.5 2.5 l -7.5 2.5 l -2.5 7.5 l -2.5 -7.5 l -7.5 -2.5 l 7.5 -2.5 Z"/>
  </g>

  <!-- Clouds -->
  <g fill="#B0C4DE" opacity="0.6">
    <!-- Cloud 1 -->
    <ellipse cx="100" cy="250" rx="40" ry="20"/>
    <ellipse cx="85" cy="240" rx="25" ry="15"/>
    <ellipse cx="115" cy="240" rx="30" ry="18"/>

    <!-- Cloud 2 -->
    <ellipse cx="300" cy="300" rx="50" ry="25"/>
    <ellipse cx="280" cy="290" rx="30" ry="18"/>
    <ellipse cx="325" cy="290" rx="35" ry="20"/>
  </g>

  <!-- Music note -->
  <g fill="#87CEEB" stroke="#4682B4" stroke-width="2">
    <!-- Note stem -->
    <rect x="190" y="180" width="4" height="70" rx="2"/>
    <!-- Note head -->
    <ellipse cx="192" cy="250" rx="12" ry="8"/>
    <!-- Note flag -->
    <path d="M 194 180 Q 210 170 215 185 Q 212 195 194 200" fill="#87CEEB"/>
  </g>

  <!-- Peace dove silhouette -->
  <g transform="translate(200, 340)" fill="#F0F8FF">
    <ellipse cx="0" cy="0" rx="15" ry="8"/>
    <!-- Wing -->
    <path d="M -15 -2 Q -25 -8 -30 -5 Q -25 0 -15 2 Z"/>
    <path d="M 15 -2 Q 25 -8 30 -5 Q 25 0 15 2 Z"/>
    <!-- Head -->
    <circle cx="-12" cy="-2" r="4"/>
  </g>
</svg>
